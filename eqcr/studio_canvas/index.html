<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sơ đồ kiến trúc Quantum</title>
  <link rel="stylesheet" href="./canvas.css">
  <script src="./canvas.js" defer></script>
</head>
<body>
  <div class="workspace">
    <section aria-labelledby="input-heading">
      <header class="panel-head">
        <span class="index">01</span><h2 id="input-heading">Sơ đồ đầu vào</h2>
      </header>
      <div class="toolbar" aria-label="Công cụ sơ đồ">
        <button id="add-component">+ Component</button>
        <button id="add-store">+ Kho</button>
        <button id="connect" aria-pressed="false">Nối</button>
        <button id="separate" aria-pressed="false">Bắt buộc tách</button>
        <button id="reset">Nạp mẫu</button>
      </div>
      <p id="hint" class="hint" aria-live="polite"></p>
      <div id="input-graph" class="diagram input-graph" aria-label="Sơ đồ component có thể kéo thả">
        <canvas aria-hidden="true"></canvas><div id="input-nodes"></div><div id="input-edges"></div>
      </div>
      <div id="inspector" class="inspector" aria-label="Chỉnh phần tử được chọn"></div>
      <details id="requirements-editor" class="requirements-editor">
        <summary>Requirements <span id="requirement-count"></span></summary>
        <div id="requirement-list" class="requirement-list"></div>
        <button id="add-requirement">+ Requirement</button>
      </details>
      <div class="action">
        <button id="analyze" class="primary">Phân tích sơ đồ</button>
        <span id="message" role="status"></span>
      </div>
    </section>
    <section aria-labelledby="output-heading">
      <header class="panel-head">
        <span class="index">02</span><h2 id="output-heading">Sơ đồ đầu ra</h2>
      </header>
      <div class="toolbar">
        <label for="plan">Hiển thị</label><select id="plan" disabled aria-label="Phương án trên sơ đồ"></select>
      </div>
      <p id="output-hint" class="hint" aria-live="polite">Chạy phân tích để tạo Quantum từ sơ đồ bên trái.</p>
      <div id="output-graph" class="diagram output-graph" aria-label="Sơ đồ Quantum được suy ra">
        <canvas aria-hidden="true"></canvas><div id="quanta"></div>
      </div>
      <section id="quality-profile" class="quality-profile" aria-labelledby="profile-heading" hidden>
        <h3 id="profile-heading">Quality Profile</h3>
        <label for="profile-select">Quantum hoặc tương tác</label>
        <select id="profile-select"></select>
        <div id="profile-content"></div>
      </section>
      <div id="trace" class="inspector" aria-live="polite"></div>
    </section>
  </div>
</body>
</html>
